name: Validate Popular Fetch

# Manual-only diagnostic that exercises Azure OIDC login and the
# App Insights query used by deploy.yml to refresh popular.json.
# Does not build the site, does not deploy, and does not write to the
# repository — it just proves the credentials and query work end to end.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for Azure OIDC federated credential

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        working-directory: ./scripts
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch popular notebooks from App Insights
        working-directory: ./scripts
        env:
          APP_INSIGHTS_RESOURCE_ID: ${{ vars.APP_INSIGHTS_RESOURCE_ID }}
        run: npx tsx fetch-popular.ts

      - name: Show fetched popular.json
        run: |
          echo "::group::site/src/data/popular.json"
          cat site/src/data/popular.json
          echo "::endgroup::"
